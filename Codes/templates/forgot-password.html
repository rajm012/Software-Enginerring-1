<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SafeAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2 class="text-gradient">🔐 Reset Password</h2>
                <p id="stepTitle">Enter your email address</p>
            </div>

            <!-- Step 1: Email -->
            <form id="emailForm" class="step active">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100 mb-3">Send OTP</button>
            </form>

            <!-- Step 2: OTP Verification -->
            <form id="otpForm" class="step" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Enter 6-digit OTP</label>
                    <div class="d-flex justify-content-center">
                        <input type="text" class="otp-input" maxlength="1" id="otp1" />
                        <input type="text" class="otp-input" maxlength="1" id="otp2" />
                        <input type="text" class="otp-input" maxlength="1" id="otp3" />
                        <input type="text" class="otp-input" maxlength="1" id="otp4" />
                        <input type="text" class="otp-input" maxlength="1" id="otp5" />
                        <input type="text" class="otp-input" maxlength="1" id="otp6" />
                    </div>
                    <small class="text-muted d-block text-center mt-2">OTP expires in <span id="timer">10:00</span></small>
                </div>
                <button type="submit" class="btn btn-gradient w-100 mb-2">Verify OTP</button>
                <button type="button" class="btn btn-outline-secondary w-100" id="resendOtp">Resend OTP</button>
            </form>

            <!-- Step 3: Reset Password -->
            <form id="resetForm" class="step" style="display: none;">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required>
                    <small class="text-muted">Minimum 6 characters</small>
                </div>
                <div class="mb-3">
                    <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100 mb-3">Reset Password</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login.html" class="text-decoration-none">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API from '/static/js/api.js';
        import { showLoading, hideLoading, showToast, validatePassword } from '/static/js/utils.js';

        let userEmail = '';
        let userOtp = '';
        let timerInterval;

        // OTP Input Auto-focus
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Step 1: Send OTP
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            userEmail = document.getElementById('email').value.trim();

            showLoading();
            try {
                await API.forgotPassword(userEmail);
                showToast('OTP sent to your email!', 'success');
                showStep(2);
                startTimer();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        });

        // Step 2: Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            userOtp = Array.from(otpInputs).map(input => input.value).join('');

            if (userOtp.length !== 6) {
                showToast('Please enter complete OTP', 'warning');
                return;
            }

            showLoading();
            try {
                await API.verifyOtp(userEmail, userOtp);
                showToast('OTP verified!', 'success');
                clearInterval(timerInterval);
                showStep(3);
            } catch (error) {
                showToast(error.message, 'danger');
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            } finally {
                hideLoading();
            }
        });

        // Step 3: Reset Password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match!', 'danger');
                return;
            }

            const passwordCheck = validatePassword(newPassword);
            if (!passwordCheck.valid) {
                showToast(passwordCheck.message, 'danger');
                return;
            }

            showLoading();
            try {
                await API.resetPassword(userEmail, userOtp, newPassword);
                showToast('Password reset successful!', 'success');
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        });

        // Resend OTP
        document.getElementById('resendOtp').addEventListener('click', async () => {
            showLoading();
            try {
                await API.forgotPassword(userEmail);
                showToast('OTP resent!', 'success');
                clearInterval(timerInterval);
                startTimer();
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        });

        function showStep(step) {
            document.querySelectorAll('.step').forEach(s => s.style.display = 'none');
            
            if (step === 1) {
                document.getElementById('emailForm').style.display = 'block';
                document.getElementById('stepTitle').textContent = 'Enter your email address';
            } else if (step === 2) {
                document.getElementById('otpForm').style.display = 'block';
                document.getElementById('stepTitle').textContent = 'Enter OTP sent to your email';
                otpInputs[0].focus();
            } else if (step === 3) {
                document.getElementById('resetForm').style.display = 'block';
                document.getElementById('stepTitle').textContent = 'Create new password';
            }
        }

        function startTimer() {
            let timeLeft = 600; // 10 minutes
            const timerElement = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showToast('OTP expired. Please request a new one.', 'warning');
                }
            }, 1000);
        }
    </script>
</body>
</html>
