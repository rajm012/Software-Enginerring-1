<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Panel - SafeAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">👥 Users Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin-dashboard.html">📊 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link">👤 <span id="adminName"></span></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="text-gradient">Users & Location Distribution</h2>
                    <p class="text-muted">View all registered users and contact information</p>
                </div>
            </div>

            <!-- Statistics -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                        <div class="stat-label">Total Users</div>
                        <div class="stat-number" id="totalUsers">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #28a745; color: white;">
                        <div class="stat-label">Regular Users</div>
                        <div class="stat-number" id="regularUsers">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #17a2b8; color: white;">
                        <div class="stat-label">Admins</div>
                        <div class="stat-number" id="adminUsers">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #ffc107; color: #333;">
                        <div class="stat-label">Cities Covered</div>
                        <div class="stat-number" id="citiesCovered">0</div>
                    </div>
                </div>
            </div>

            <!-- Location Distribution -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">📍 Users by Location</h5>
                        </div>
                        <div class="card-body">
                            <div class="row" id="locationDistribution">
                                <div class="col-12 text-center py-4">
                                    <div class="spinner-border" role="status"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- All Users Table -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">All Users</h5>
                            <input type="text" class="form-control w-25" id="searchUsers" placeholder="Search users...">
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Location</th>
                                            <th>Role</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="usersTableBody">
                                        <tr>
                                            <td colspan="6" class="text-center py-4">Loading...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Detail Modal -->
    <div class="modal fade" id="userDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">User Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="userDetailBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API from '/static/js/api.js';
        import { 
            showLoading, hideLoading, showToast, getUserData, clearUserData,
            requireAuth, requireAdmin, formatDate
        } from '/static/js/utils.js';

        (async function() {
            if (!requireAuth()) {
                window.location.href = '/login.html';
                return;
            }
            if (!requireAdmin()) {
                window.location.href = '/user-dashboard.html';
                return;
            }

            const admin = getUserData();
            document.getElementById('adminName').textContent = admin.name;

            let allUsers = [];

            async function loadUsers() {
                showLoading();
                try {
                    const response = await API.getAllUsers();
                    allUsers = response.users;
                    
                    // Update statistics
                    document.getElementById('totalUsers').textContent = response.total_users;
                    const regularCount = allUsers.filter(u => !u.is_admin).length;
                    const adminCount = allUsers.filter(u => u.is_admin).length;
                    document.getElementById('regularUsers').textContent = regularCount;
                    document.getElementById('adminUsers').textContent = adminCount;
                    document.getElementById('citiesCovered').textContent = Object.keys(response.location_stats).length;
                    
                    // Display location distribution
                    displayLocationDistribution(response.location_stats);
                    
                    // Display users table
                    displayUsers(allUsers);
                    
                } catch (error) {
                    showToast(error.message, 'danger');
                } finally {
                    hideLoading();
                }
            }

            function displayLocationDistribution(locationStats) {
                const container = document.getElementById('locationDistribution');
                
                // Sort by user count
                const sorted = Object.entries(locationStats).sort((a, b) => b[1].count - a[1].count);
                
                container.innerHTML = sorted.map(([city, data]) => `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card hover-lift">
                            <div class="card-body">
                                <h5 class="card-title">📍 ${city}</h5>
                                <p class="card-text">
                                    <strong class="text-primary fs-3">${data.count}</strong> user${data.count > 1 ? 's' : ''}
                                </p>
                                <button class="btn btn-sm btn-outline-primary" onclick="showCityUsers('${city}')">
                                    View Users
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            function displayUsers(users) {
                const tbody = document.getElementById('usersTableBody');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No users found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.location}</td>
                        <td>
                            ${user.is_admin 
                                ? '<span class="badge bg-danger">Admin</span>' 
                                : '<span class="badge bg-success">User</span>'}
                        </td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="showUserDetail(${user.id})">
                                View Details
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            window.showUserDetail = function(userId) {
                const user = allUsers.find(u => u.id === userId);
                if (!user) return;
                
                document.getElementById('userDetailBody').innerHTML = `
                    <div class="mb-2"><strong>ID:</strong> ${user.id}</div>
                    <div class="mb-2"><strong>Name:</strong> ${user.name}</div>
                    <div class="mb-2"><strong>Email:</strong> <a href="mailto:${user.email}">${user.email}</a></div>
                    <div class="mb-2"><strong>Location:</strong> ${user.location}</div>
                    <div class="mb-2"><strong>Role:</strong> ${user.is_admin ? 'Administrator' : 'Regular User'}</div>
                    <div class="mb-2"><strong>Registered:</strong> ${formatDate(user.created_at)}</div>
                `;
                
                const modal = new bootstrap.Modal(document.getElementById('userDetailModal'));
                modal.show();
            };

            window.showCityUsers = function(city) {
                const cityUsers = allUsers.filter(u => u.location === city);
                displayUsers(cityUsers);
                window.scrollTo({ top: document.getElementById('usersTableBody').offsetTop - 100, behavior: 'smooth' });
            };

            // Search functionality
            document.getElementById('searchUsers').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = allUsers.filter(user => 
                    user.name.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm) ||
                    user.location.toLowerCase().includes(searchTerm)
                );
                displayUsers(filtered);
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    await API.logout();
                    clearUserData();
                    window.location.href = '/login.html';
                } catch (error) {
                    showToast(error.message, 'danger');
                }
            });

            loadUsers();
        })();
    </script>
</body>
</html>
