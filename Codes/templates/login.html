<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2 class="text-gradient">🚨 SafeAlert</h2>
                <p>Login to your account</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn btn-gradient w-100 mb-3">Login</button>

                <div class="text-center mb-3">
                    <a href="/forgot-password.html" class="text-decoration-none">Forgot Password?</a>
                </div>

                <hr>

                <div class="text-center">
                    <p class="mb-2">Don't have an account?</p>
                    <a href="/register.html" class="btn btn-outline-primary w-100 mb-2">Register as User</a>
                    <a href="/register-admin.html" class="btn btn-outline-success w-100">Register as Admin</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API from '/static/js/api.js';
        import { showLoading, hideLoading, showToast, setUserData } from '/static/js/utils.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            showLoading();
            try {
                const response = await API.login({ email, password });
                
                setUserData(response.user);
                showToast('Login successful!', 'success');
                
                setTimeout(() => {
                    if (response.user.is_admin) {
                        window.location.href = '/admin-dashboard.html';
                    } else {
                        window.location.href = '/user-dashboard.html';
                    }
                }, 1000);
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
