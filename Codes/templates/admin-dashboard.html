<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SafeAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🛡️ Admin Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/users-panel.html">👥 Users</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link">👤 <span id="adminName"></span></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container-fluid">
            <!-- Statistics -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                        <div class="stat-label">Total Alerts</div>
                        <div class="stat-number" id="totalAlerts">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #ffc107; color: #333;">
                        <div class="stat-label">Pending</div>
                        <div class="stat-number" id="pendingAlerts">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #17a2b8; color: white;">
                        <div class="stat-label">Verified</div>
                        <div class="stat-number" id="verifiedAlerts">0</div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: #28a745; color: white;">
                        <div class="stat-label">Sent</div>
                        <div class="stat-number" id="sentAlerts">0</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="row mb-4">
                <div class="col-12">
                    <button class="btn btn-gradient me-2" data-bs-toggle="modal" data-bs-target="#createAlertModal">
                        ➕ Create New Alert
                    </button>
                    <button class="btn btn-outline-primary" id="refreshBtn">🔄 Refresh</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="row mb-3">
                <div class="col-md-3">
                    <select class="form-select" id="statusFilter">
                        <option value="">All Statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="VERIFIED">Verified</option>
                        <option value="SENT">Sent</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="severityFilter">
                        <option value="">All Severities</option>
                        <option value="CRITICAL">Critical</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
            </div>

            <!-- Alerts Table -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">All Alerts</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Title</th>
                                            <th>Severity</th>
                                            <th>Location</th>
                                            <th>Status</th>
                                            <th>Created</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="alertsTableBody">
                                        <tr>
                                            <td colspan="7" class="text-center py-4">Loading...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Alert Modal -->
    <div class="modal fade" id="createAlertModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Alert</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createAlertForm">
                        <div class="mb-3">
                            <label for="alertTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="alertTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="alertMessage" class="form-label">Message</label>
                            <textarea class="form-control" id="alertMessage" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="alertSeverity" class="form-label">Severity</label>
                            <select class="form-select" id="alertSeverity" required>
                                <option value="LOW">Low</option>
                                <option value="MEDIUM">Medium</option>
                                <option value="HIGH">High</option>
                                <option value="CRITICAL">Critical</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="alertLocation" class="form-label">Location</label>
                            <select class="form-select" id="alertLocation" required>
                                <option value="">-- Select City --</option>
                            </select>
                            <input type="text" class="form-control mt-2" id="customAlertLocation" placeholder="Or enter custom location">
                            <div class="form-text">Select from list or enter manually</div>
                        </div>
                        <div class="mb-3">
                            <label for="scheduledDate" class="form-label">Expected Disaster Date/Time (Optional)</label>
                            <input type="datetime-local" class="form-control" id="scheduledDate">
                            <div class="form-text">When is the disaster expected to hit? (Leave empty for immediate)</div>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-gradient">Create Alert</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Detail Modal -->
    <div class="modal fade" id="alertDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalTitle">Alert Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailModalBody"></div>
                <div class="modal-footer" id="detailModalFooter"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import API from '/static/js/api.js';
        import { 
            showLoading, hideLoading, showToast, getUserData, clearUserData,
            requireAuth, requireAdmin, formatDate, getSeverityIcon, 
            getSeverityClass, getStatusClass, confirmDialog
        } from '/static/js/utils.js';

        (async function() {
            if (!requireAuth()) {
                window.location.href = '/login.html';
                return;
            }
            if (!requireAdmin()) {
                window.location.href = '/user-dashboard.html';
                return;
            }

            const admin = getUserData();
            document.getElementById('adminName').textContent = admin.name;

        // Load cities into dropdown
        async function loadCities() {
            try {
                const response = await API.getCities();
                const citySelect = document.getElementById('alertLocation');
                response.cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load cities:', error);
            }
        }

        loadCities();

        let allAlerts = [];
        let currentFilter = { status: '', severity: '' };

        // Load stats and alerts
        async function loadDashboard() {
            showLoading();
            try {
                const [statsResponse, alertsResponse] = await Promise.all([
                    API.getAlertStats(),
                    API.getAllAlerts(currentFilter.status)
                ]);

                updateStatistics(statsResponse);
                allAlerts = alertsResponse.alerts;
                displayAlerts(allAlerts);
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        function updateStatistics(stats) {
            document.getElementById('totalAlerts').textContent = stats.total_alerts;
            document.getElementById('pendingAlerts').textContent = stats.by_status.pending;
            document.getElementById('verifiedAlerts').textContent = stats.by_status.verified;
            document.getElementById('sentAlerts').textContent = stats.by_status.sent;
        }

        function displayAlerts(alerts) {
            const tbody = document.getElementById('alertsTableBody');

            if (alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No alerts found</td></tr>';
                return;
            }

            tbody.innerHTML = alerts.map(alert => `
                <tr onclick="showAlertDetail(${alert.id})" style="cursor: pointer;">
                    <td>${alert.id}</td>
                    <td><strong>${alert.title}</strong></td>
                    <td><span class="severity-badge ${getSeverityClass(alert.severity)}">${alert.severity}</span></td>
                    <td>${alert.location}</td>
                    <td><span class="status-badge ${getStatusClass(alert.status)}">${alert.status}</span></td>
                    <td>${formatDate(alert.created_at)}</td>
                    <td onclick="event.stopPropagation()">
                        ${alert.status === 'PENDING' ? 
                            `<button class="btn btn-sm btn-info" onclick="verifyAlertAction(${alert.id})">Verify</button>` : ''}
                        ${alert.status === 'VERIFIED' ? 
                            `<button class="btn btn-sm btn-success" onclick="dispatchAlertAction(${alert.id})">Dispatch</button>` : ''}
                        ${alert.status === 'PENDING' ? 
                            `<button class="btn btn-sm btn-danger" onclick="deleteAlertAction(${alert.id})">Delete</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        // Create Alert
        document.getElementById('createAlertForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get location from dropdown or custom input
            const citySelect = document.getElementById('alertLocation').value.trim();
            const customLocation = document.getElementById('customAlertLocation').value.trim();
            const location = customLocation || citySelect;
            
            if (!location) {
                showToast('Please select or enter a location', 'warning');
                return;
            }

            const scheduledDate = document.getElementById('scheduledDate').value;

            const alertData = {
                title: document.getElementById('alertTitle').value.trim(),
                message: document.getElementById('alertMessage').value.trim(),
                severity: document.getElementById('alertSeverity').value,
                location: location
            };
            
            // Add scheduled_date if provided
            if (scheduledDate) {
                alertData.scheduled_date = new Date(scheduledDate).toISOString();
            }

            showLoading();
            try {
                await API.createAlert(alertData);
                showToast('Alert created successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('createAlertModal')).hide();
                document.getElementById('createAlertForm').reset();
                loadDashboard();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        });

        window.showAlertDetail = async function(alertId) {
            showLoading();
            try {
                const response = await API.getAlertById(alertId);
                const alert = response.alert;

                document.getElementById('detailModalTitle').innerHTML = 
                    `${getSeverityIcon(alert.severity)} ${alert.title}`;
                
                let statsHtml = '';
                if (alert.delivery_stats) {
                    statsHtml = `
                        <div class="mb-3">
                            <strong>Delivery Statistics:</strong>
                            <ul>
                                <li>Total Recipients: ${alert.delivery_stats.total}</li>
                                <li>Successfully Sent: ${alert.delivery_stats.success}</li>
                                <li>Failed: ${alert.delivery_stats.failed}</li>
                            </ul>
                        </div>
                    `;
                }

                document.getElementById('detailModalBody').innerHTML = `
                    <div class="mb-3">
                        <span class="severity-badge ${getSeverityClass(alert.severity)}">${alert.severity}</span>
                        <span class="status-badge ${getStatusClass(alert.status)} ms-2">${alert.status}</span>
                    </div>
                    <div class="mb-3">
                        <strong>Message:</strong>
                        <p>${alert.message}</p>
                    </div>
                    <div class="mb-2"><strong>Location:</strong> ${alert.location}</div>
                    <div class="mb-2"><strong>Created by:</strong> ${alert.created_by}</div>
                    <div class="mb-2"><strong>Created:</strong> ${formatDate(alert.created_at)}</div>
                    ${alert.scheduled_date ? `<div class="mb-2"><strong>⏰ Expected Disaster Time:</strong> <span class="text-danger fw-bold">${formatDate(alert.scheduled_date)}</span></div>` : ''}
                    ${alert.verified_at ? `<div class="mb-2"><strong>Verified:</strong> ${formatDate(alert.verified_at)}</div>` : ''}
                    ${alert.sent_at ? `<div class="mb-2"><strong>Sent:</strong> ${formatDate(alert.sent_at)}</div>` : ''}
                    ${statsHtml}
                `;

                const footer = document.getElementById('detailModalFooter');
                footer.innerHTML = '';

                if (alert.status === 'PENDING') {
                    footer.innerHTML = `
                        <button class="btn btn-danger" onclick="deleteAlertAction(${alert.id})">Delete</button>
                        <button class="btn btn-info" onclick="verifyAlertAction(${alert.id})">Verify</button>
                    `;
                } else if (alert.status === 'VERIFIED') {
                    footer.innerHTML = `
                        <button class="btn btn-success" onclick="dispatchAlertAction(${alert.id})">Dispatch</button>
                    `;
                }

                const modal = new bootstrap.Modal(document.getElementById('alertDetailModal'));
                modal.show();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        };

        window.verifyAlertAction = async function(alertId) {
            if (!confirmDialog('Are you sure you want to verify this alert?')) return;

            showLoading();
            try {
                await API.verifyAlert(alertId);
                showToast('Alert verified successfully!', 'success');
                loadDashboard();
                const modal = bootstrap.Modal.getInstance(document.getElementById('alertDetailModal'));
                if (modal) modal.hide();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        };

        window.dispatchAlertAction = async function(alertId) {
            if (!confirmDialog('Dispatch this alert to all affected users?')) return;

            showLoading();
            try {
                const response = await API.dispatchAlert(alertId);
                showToast(`Alert dispatched! Success: ${response.stats.success}, Failed: ${response.stats.failed}`, 'success');
                loadDashboard();
                const modal = bootstrap.Modal.getInstance(document.getElementById('alertDetailModal'));
                if (modal) modal.hide();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        };

        window.deleteAlertAction = async function(alertId) {
            if (!confirmDialog('Delete this alert? This action cannot be undone.')) return;

            showLoading();
            try {
                await API.deleteAlert(alertId);
                showToast('Alert deleted successfully!', 'success');
                loadDashboard();
                const modal = bootstrap.Modal.getInstance(document.getElementById('alertDetailModal'));
                if (modal) modal.hide();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        };

        // Filters
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            currentFilter.status = e.target.value;
            loadDashboard();
        });

        document.getElementById('severityFilter').addEventListener('change', (e) => {
            const severity = e.target.value;
            const filtered = severity 
                ? allAlerts.filter(a => a.severity === severity)
                : allAlerts;
            displayAlerts(filtered);
        });

        // Refresh
        document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await API.logout();
                clearUserData();
                window.location.href = '/login.html';
            } catch (error) {
                showToast(error.message, 'danger');
            }
        });

        // Auto-refresh every 2 minutes
        setInterval(loadDashboard, 120000);

        loadDashboard();
        })();
    </script>
</body>
</html>
